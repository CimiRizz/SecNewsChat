<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132724">
  <title>Uutiskeskustelu</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead"><div class="wrap">
    <a class="brand" href="/">Uutiskeskustelu</a>
    <a class="moderation-link" href="#yllapito">Ylläpito</a>
  </div></header>
  <main class="wrap">
    <section id="forum">
      <div class="intro">
        <h1>Top 10 luetuinta</h1>
        <p>Ilta-Sanomien ja Iltalehden luetuimpia uutisia, joita ei voi kommentoida lehden sivulla.</p>
      </div>
      <div class="filter" role="group" aria-label="Uutislähde">
        <button type="button" data-source="" aria-pressed="true">Kaikki</button>
        <button type="button" data-source="IS" aria-pressed="false">Ilta-Sanomat</button>
        <button type="button" data-source="IL" aria-pressed="false">Iltalehti</button>
      </div>
      <p id="status" role="status">Tarkistetaan lehtien listoja…</p>
      <p id="updated" class="meta"></p>
      <ol id="threads"></ol>
    </section>
    <section id="thread" hidden>
      <a class="back" href="#">← Keskustelut</a>
      <div id="article"></div>
      <form id="reply">
        <h2>Kirjoita viesti</h2>
        <label>Nimimerkki<input name="author" required maxlength="32" autocomplete="nickname"></label>
        <label>Viesti<textarea name="body" required maxlength="3000" rows="4"></textarea></label>
        <button class="primary">Lähetä viesti</button>
      </form>
      <p id="thread-status" role="status"></p>
      <ul id="messages"></ul>
    </section>
    <section id="moderation" hidden>
      <a class="back" href="#">← Keskustelut</a>
      <h1>Ylläpito</h1>
      <form id="admin">
        <label>Ylläpitäjän avain<input name="token" type="password" required autocomplete="off"></label>
        <button class="primary">Avaa ilmoitukset</button>
      </form>
      <form id="lock" hidden>
        <label>Ketjun numero<input name="id" type="number" min="1" step="1" required></label>
        <button name="action" value="lock">Lukitse</button>
        <button name="action" value="unlock">Avaa lukitus</button>
      </form>
      <p id="admin-status" role="status"></p>
      <ul id="reports"></ul>
    </section>
  </main>
  <footer class="wrap">Riippumaton keskustelupalsta</footer>
</body>
</html>
